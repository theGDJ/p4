# =============================================================================
#  BIS-Saathi backend configuration.
#
#  Every value that differs between environments comes from the environment; this
#  file holds only structure and safe defaults. `docker-compose.yml` and
#  `.env.example` at the repo root are the authoritative list of variables — a key
#  added here without an entry there will not be set in a real deployment.
#
#  ⚠ Authored, not executed: no JVM or PostgreSQL was available in the authoring
#  sandbox, so this file has never been loaded by Spring (see docs/ENVIRONMENT.md).
# =============================================================================

spring:
  application:
    name: bis-saathi-backend

  # ---------------------------------------------------------------- datasource
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bissaathi}
    username: ${POSTGRES_USER:bissaathi}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      # Fail fast rather than queueing behind a dead database (R8).
      initialization-fail-timeout: 5000

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` catches a drift between the entities and
      # V1__init.sql at boot instead of at first query.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # A failed migration must stop the app; booting on a half-applied schema would
    # produce wrong answers that look correct.
    clean-disabled: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  # Jackson 3 in Boot 4 lives under tools.jackson; these property names are the
  # Boot-level ones and are unchanged.
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      # Rejects unknown JSON keys, which is what stops a client from smuggling
      # `roles` or `emailVerified` into PATCH /users/me (§8).
      fail-on-unknown-properties: true

  threads:
    virtual:
      # Java 21 virtual threads: SSE streams are I/O-bound and mostly parked.
      enabled: true

# --------------------------------------------------------------------- server
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Behind the frontend proxy / nginx, so the real client IP arrives in a header.
  forward-headers-strategy: framework
  error:
    # The GlobalExceptionHandler owns error bodies; Boot's whitelabel must never
    # leak a stack trace or an internal message (§8).
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ------------------------------------------------------------------- actuator
management:
  endpoints:
    web:
      exposure:
        # info only. Health is served by MetaController at the two paths docs/API.md
        # fixes (/health/live, /health/ready); exposing Actuator's own /health,
        # /health/liveness and /health/readiness alongside them would give a
        # deployment four health URLs, three of which nothing checks.
        include: info
      base-path: /api/v1
  endpoint:
    health:
      # Enabled so the db/redis indicators are still contributed to the readiness
      # group that Actuator exposes on the management port, but NOT published under
      # /api/v1 — docs/API.md fixes the two public paths and MetaController implements
      # them. No `group:` block here: Boot's property is singular
      # (management.endpoint.health.group.<name>.include), and a plural key would be
      # silently ignored, which is worse than not writing it.
      enabled: true
      show-details: never
  info:
    env:
      enabled: true

# -------------------------------------------------------------------- springdoc
springdoc:
  api-docs:
    enabled: true
    path: /api/v1/openapi.json
  swagger-ui:
    enabled: true
    path: /api/v1/docs
    # The API contract is docs/API.md; Swagger UI is a convenience, never the spec.
    operations-sorter: alpha

# =============================================================================
#  Application configuration (bound by AppProperties)
# =============================================================================
bissaathi:
  cors:
    # An allowlist, never "*". The Vite dev server and the preview host are added
    # by docker-compose / .env; the default only permits local development.
    # Comma-separated, exactly as .env.example documents it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  jwt:
    # HS256 with a >= 32-byte secret. There is deliberately no second secret for the
    # refresh token: those are opaque random strings matched by digest, never signed.
    # CookiePropertiesValidator refuses a development value in a production profile.
    secret: ${JWT_ACCESS_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    issuer: ${JWT_ISSUER:bis-saathi}
    audience: ${JWT_AUDIENCE:bis-saathi-web}

  refresh:
    ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    # Name and path are fixed by docs/API.md and by AuthController's mapping, so
    # they are literals rather than environment knobs: a renamed cookie silently
    # breaks reuse detection, which is not a thing to discover at deploy time.
    cookie-name: bs_refresh
    cookie-path: /api/v1/auth
    # Secure + HttpOnly + SameSite are non-negotiable (§8). `same-site: none` would
    # be required only for a cross-site frontend and is refused at boot.
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}

  password:
    min-length: 10
    max-length: 200
    # argon2id is the default; bcrypt(12) is the documented fallback for
    # environments without BouncyCastle. Hashes record which was used.
    # argon2id always; bcrypt(12) is only used to verify a hash recorded with it.
    scheme: argon2id
    argon2:
      memory-kib: 19456
      iterations: 2
      parallelism: 1
    bcrypt-strength: 12
    reset-token-ttl-minutes: 30

  lockout:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${LOGIN_LOCKOUT_MINUTES:15}

  rate-limit:
    # The window and general ceiling come from the shared pair; the auth bucket is
    # tighter because that is the credential-guessing surface.
    enabled: true
    auth-max: ${RATE_LIMIT_AUTH_MAX:10}
    auth-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    chat-max: ${RATE_LIMIT_MAX_REQUESTS:120}
    chat-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  csrf:
    enabled: ${CSRF_ENABLED:true}
    cookie-name: XSRF-TOKEN
    header-name: X-XSRF-TOKEN

  rag:
    # Provider switch (§3: config-switchable, mockable in tests). `mock` is the
    # default and is deterministic; the UI must show a MOCK PROVIDER badge whenever
    # it is active (R8/R10).
    llm-provider: ${LLM_PROVIDER:mock}
    embedding-provider: ${EMBEDDING_PROVIDER:mock}
    llm-base-url: ${LLM_BASE_URL:}
    llm-api-key: ${LLM_API_KEY:}
    llm-small-model: ${LLM_SMALL_MODEL:mock-small}
    llm-large-model: ${LLM_LARGE_MODEL:mock-large}
    # Costs are reported only when priced: an unset price means a null cost, never a
    # guessed one (R10).
    llm-price-input-per-mtok: ${LLM_PRICE_INPUT_PER_MTOK:}
    llm-price-output-per-mtok: ${LLM_PRICE_OUTPUT_PER_MTOK:}
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    embedding-api-key: ${EMBEDDING_API_KEY:}
    embedding-model: ${EMBEDDING_MODEL:mock-multilingual-1}
    # Must match `knowledge_chunks.embedding vector(1024)` in V1__init.sql: changing
    # this is a re-embed of the corpus, not a restart.
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
    top-k-vector: ${RAG_TOP_K_RETRIEVE:30}
    top-k-fts: ${RAG_TOP_K_RETRIEVE:30}
    max-context-chunks: ${RAG_TOP_K_FINAL:6}
    max-context-tokens: ${RAG_CONTEXT_MAX_TOKENS:3000}
    # Cosine-similarity floor for a chunk to count as evidence for STRONG tier.
    evidence-score-threshold: 0.12
    dedupe-jaccard-threshold: 0.82
    temperature: 0.0
    max-follow-ups: 3
    history-turns: ${RAG_HISTORY_TURNS:4}
    summary-max-tokens: ${RAG_SUMMARY_MAX_TOKENS:150}
    # Timeouts and retries are per call, not per turn: one question can make several
    # requests (routing, rewrite, answer), and a hung provider must not hold an SSE
    # stream open forever.
    # Milliseconds, like the env names: a `timeout-seconds` bound from
    # `${LLM_TIMEOUT_MS:...}` would be an invisible factor-of-1000 bug that only shows
    # up as a request that hangs for eleven hours.
    llm-timeout-millis: ${LLM_TIMEOUT_MS:45000}
    llm-max-retries: ${LLM_MAX_RETRIES:2}
    embedding-timeout-millis: ${EMBEDDING_TIMEOUT_MS:30000}
    embedding-max-retries: ${EMBEDDING_MAX_RETRIES:2}
    embedding-batch-size: ${EMBEDDING_BATCH_SIZE:32}

  answers:
    # Contractual strings (CLAUDE.md §5 R4/R5). They are configuration so that a
    # translation fix does not require a code change — but tests assert them
    # verbatim, so they cannot drift silently.
    insufficient-evidence-en: >-
      I could not find sufficient information in the authorized knowledge base to
      answer this reliably.
    insufficient-evidence-hi: >-
      मुझे इसका विश्वसनीय उत्तर देने के लिए अधिकृत ज्ञान-कोष में पर्याप्त जानकारी
      नहीं मिली।
    disclaimer-en: Informational — verify against current official sources
    disclaimer-hi: सूचनात्मक — कृपया वर्तमान आधिकारिक स्रोतों से सत्यापित करें
    cache:
      # The semantic answer cache (§9). A turn is cacheable only when it is
      # impersonal, has no prior history, produced evidence and hit no provider error;
      # keys carry the knowledge-base version so an approval or rejection invalidates
      # every answer that quoted the affected chunk.
      enabled: ${SEMANTIC_CACHE_ENABLED:true}
      ttl-seconds: ${ANSWER_CACHE_TTL_SECONDS:900}
      max-entries: ${ANSWER_CACHE_MAX_ENTRIES:500}
      # Measured on the offline trigram embeddings, 0.94 already admits two different
      # questions; treat this as a floor to re-validate with real multilingual
      # embeddings, not a tuned value (docs/ENVIRONMENT.md).
      similarity: ${SEMANTIC_CACHE_SIMILARITY:0.94}

  ingestion:
    # §5. The byte cap is enforced while streaming, not from Content-Length, so a
    # server that announces 1 KB and sends 1 GB is cut off mid-body.
    max-bytes: ${INGEST_MAX_BYTES:25000000}
    timeout-millis: ${INGEST_TIMEOUT_MS:20000}
    max-redirects: ${INGEST_MAX_REDIRECTS:3}
    # Test-only. Fatal in production: with this on, an operator-supplied URL can point
    # at loopback, RFC1918 or a cloud metadata endpoint (docs/SECURITY.md §9).
    allow-private-networks: ${INGEST_ALLOW_PRIVATE_NETWORKS:false}
    user-agent: ${INGEST_USER_AGENT:BIS-Saathi-knowledge-ingestion/0.1}
    max-pages: ${INGEST_MAX_PAGES:120}
    chunk-min-tokens: ${CHUNK_MIN_TOKENS:300}
    chunk-max-tokens: ${CHUNK_MAX_TOKENS:500}
    chunk-overlap-ratio: ${CHUNK_OVERLAP_RATIO:0.1}
    manifest-path: ${KNOWLEDGE_MANIFEST_PATH:knowledge/manifest.csv}
    upload-dir: ${UPLOAD_DIR:uploads}
    upload-max-bytes: ${UPLOAD_MAX_BYTES:26214400}
    # Submissions are throttled per account, not per IP: one manager pasting a 400-row
    # manifest must not starve the queue for everybody else.
    burst-capacity: ${INGEST_BURST_CAPACITY:12}
    sustained-per-minute: ${INGEST_SUSTAINED_PER_MINUTE:12}

  mail:
    # none | log | smtp. With `none` the reset endpoint says no mail could be sent
    # instead of claiming a delivery that never happened (R8).
    transport: ${MAIL_TRANSPORT:log}
    url: ${SMTP_URL:}
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    secure: ${SMTP_SECURE:false}
    user: ${SMTP_USER:}
    pass: ${SMTP_PASS:}
    from: ${SMTP_FROM:}
    subject-prefix: ${MAIL_SUBJECT_PREFIX:[BIS-Saathi]}
    # Reset links are absolute; unset means the mail states the token itself.
    public-url: ${APP_PUBLIC_URL:}

  seed:
    # Dev-only demo accounts. Disabled unless explicitly enabled AND the profile is
    # not production; the generated passwords are printed once to the log.
    enabled: ${SEED_DEMO_USERS:false}
    password: ${SEED_DEMO_PASSWORD:}

# ----------------------------------------------------------------------- logging
# Structured JSON logs (§3). No PII is logged: emails are hashed, tokens never
# appear, and the audit trail carries the trace ref instead.
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    # One knob, not three: DEBUG on LOG_LEVEL raises the application logger too. A
    # separate APP_LOG_LEVEL is a variable that only exists in this file and would
    # never be found by whoever configures a deployment.
    in.bissaathi: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: >-
      {"ts":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","logger":"%logger{36}",
      "trace":"%X{traceRef:-}","msg":"%replace(%m){'\"','\\\"'}"%n}
